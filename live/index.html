<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#07090b"/>
<title>SABLE HQ</title>
<link rel="icon" href="/favicon.svg"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap"/>
<style>:root{--bg:#07090b;--sf:#0e1418;--el:#141c22;--fg:#dce8ec;--mu:#7d929c;--su:#5a6d75;--ac:#7ecad8;--af:#071015;--bd:#1c2a31;--ok:#6db89a;--wn:#c4a15c}
*{box-sizing:border-box}html,body,#app{min-height:100dvh;margin:0;background:var(--bg);color:var(--fg);font-family:Rajdhani,system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--ac)}
.hud{min-height:100dvh;display:flex;flex-direction:column;background-image:linear-gradient(color-mix(in oklab,var(--ac) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklab,var(--ac) 5%,transparent) 1px,transparent 1px);background-size:56px 56px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:700;letter-spacing:.28em;text-decoration:none;color:var(--fg)}
.sub{font-family:IBM Plex Mono,monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}
.dock{border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-family:IBM Plex Mono,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);text-decoration:none}
.icon{width:44px;height:44px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--mu)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 20px 12px;overflow:hidden}
.term{position:relative;height:220px;flex-shrink:0}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:12px}
.panel{position:relative;background:color-mix(in oklab,var(--sf) 92%,transparent);box-shadow:0 0 0 1px rgba(220,232,236,.08);border-radius:24px;overflow:hidden}
.panel:before,.panel:after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border-color:color-mix(in oklab,var(--ac) 55%,transparent);border-style:solid;z-index:2}
.panel:before{top:8px;left:8px;border-width:1px 0 0 1px}.panel:after{right:8px;bottom:8px;border-width:0 1px 1px 0}
.h{font-family:IBM Plex Mono,monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mu);margin:0}
.scroll{overflow:auto;height:100%;padding:16px}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:0;border:0;min-width:44px;min-height:44px;z-index:3}
.dot{width:36px;height:36px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);display:flex;align-items:center;justify-content:center;font-family:IBM Plex Mono,monospace;font-size:10px}
.node.ceo .dot{border-color:var(--ac);color:var(--ac)}.node.sel .dot{background:var(--ac);color:var(--af)}
.nl{font-family:IBM Plex Mono,monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:0;padding:8px;border-radius:8px}
.row.sel,.row:hover{background:var(--el)}
.core{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100%;padding:12px}
.ring{width:176px;height:176px;border-radius:99px;border:1px solid color-mix(in oklab,var(--ac) 40%,transparent);display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle,color-mix(in oklab,var(--ac) 12%,transparent),transparent 62%)}
.ring:after{content:"";position:absolute;inset:12px;border-radius:99px;border:1px dashed color-mix(in oklab,var(--ac) 50%,transparent);animation:spin 18s linear infinite}
.eq{display:flex;gap:3px;align-items:end;height:36px}.eq i{width:4px;background:var(--ac);border-radius:99px;animation:eq 1.6s ease-in-out infinite}
.cap{text-align:center;font-size:14px;color:var(--mu);min-height:20px;max-width:280px}
.lab{font-family:IBM Plex Mono,monospace;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--ac)}
.cmd{padding:0 20px 16px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
.chip{flex-shrink:0;border:1px solid var(--bd);border-radius:999px;padding:8px 12px;background:0;font-family:IBM Plex Mono,monospace;font-size:11px;color:var(--mu)}
.form{display:flex;gap:8px;align-items:center;padding:8px}.form input{flex:1;height:44px;background:0;border:0;outline:0}
.btn{height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--ac);color:var(--af);font-weight:600}
.btn.g{background:var(--el);color:var(--fg);border:1px solid var(--bd)}
.pre{white-space:pre-wrap;font-family:IBM Plex Mono,monospace;font-size:11px;line-height:1.5;background:var(--el);padding:10px;border-radius:8px;overflow:auto;max-height:160px}
.muted{color:var(--mu);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{width:min(520px,100%);max-height:85dvh;overflow:auto;padding:20px}
.wn{color:var(--wn)}.tabs,.mob{display:none}
@media(max-width:1023px){.cols{display:none}.term{height:180px}.tabs{display:flex;border:1px solid var(--bd);border-radius:8px;padding:4px}.tabs button{flex:1;height:44px;border:0;background:0;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--mu)}.tabs button.on{background:var(--el);color:var(--fg);border-radius:6px}.mob{display:block;flex:1;min-height:0;overflow:hidden}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes eq{50%{transform:scaleY(.35)}}
@media(prefers-reduced-motion:reduce){.ring:after,.eq i{animation:none}}</style>
</head>

,"desk":"marketing","fn":"IG/TikTok DMs and comments. Qualify. Hand hot leads to Sales Inbox.","open":"https://grok.com/","kw":["inbox","dm","comment","ig","qualify"],"done":"Reply scripts plus a clear hot-lead handoff to Sales Inbox.","job":"You are Sable Inbox. Report to Marketing CEO. Own IG/TikTok DMs and comments. Qualify. Hand hot leads to Sales Inbox. Do not close deals. Never invent prices.","x":44,"y":46},{"id":"analytics","slug":"sable-analytics","name":"Sable Analytics","cs":"ANL","layer":"worker","parent":"marketing","kind":"grok-bot","desk":"marketing","fn":"Views, reach, saves, DMs scorecard. No vanity. No post or spend execution.","open":"https://grok.com/","kw":["analytics","scorecard","reach","saves","metrics"],"done":"A short scorecard from numbers the operator provided, plus one gap.","job":"You are Sable Analytics. Report to Marketing CEO. Scorecard: views, reach, saves, DMs. No vanity metrics. Do not post or spend. Use only figures given. Never invent prices.","x":56,"y":46},{"id":"edit","slug":"sable-edit","name":"Sable Edit","cs":"EDT","layer":"worker","parent":"marketing","kind":"grok-bot","desk":"marketing","fn":"Cut Reels and TikToks from raw clips.","open":"https://grok.com/","kw":["edit","cut","reel","tiktok","caption","thumbnail"],"done":"Cut notes, caption, and thumbnail language for the named clip.","job":"You are Sable Edit. Report to Marketing CEO. Cut Reels/TikToks from raw clips. The shoe is the hero. Do not change the offer. Never invent prices.","x":68,"y":46},{"id":"sales-inbox","slug":"sales-inbox","name":"Sales Inbox","cs":"SIN","layer":"worker","parent":"sales","kind":"grok-bot","desk":"sales","fn":"Intake hot handoffs. Does not own IG. Qualify. Park on Sales Manager desk.","open":"https://grok.com/","kw":["sales inbox","handoff","hot lead"],"done":"Qualified intake parked on Sales Manager desk with next action.","job":"You are Sales Inbox. Report to Sales Manager. Intake hot handoffs. You do not own IG. Qualify. Park on the Sales Manager desk. Never invent prices.","x":78,"y":46},{"id":"sales-chase","slug":"sales-chase","name":"Sales Chase","cs":"CHS","layer":"worker","parent":"sales","kind":"grok-bot","desk":"sales","fn":"Chase quoted or stuck deals. Deadlines and next actions.","open":"https://grok.com/","kw":["chase","follow up","stuck","quoted"],"done":"Each chased deal has a deadline and a next action.","job":"You are Sales Chase. Report to Sales Manager. Chase quoted or stuck deals. Deadlines + next actions. Use CRM. Never invent prices.","x":90,"y":46},{"id":"crm","slug":"sable-crm","name":"Sable CRM assistant","cs":"CRM","layer":"worker","parent":"sales","kind":"dock","desk":"sales","fn":"Pipeline new / quoted / won / lost on the live CRM.","open":"https://sable-floor.vercel.app/login","kw":["crm","pipeline","won","lost","floor crm"],"done":"The live CRM is open on the correct pipeline state. HQ did not recreate CRM.","job":"You are Sable CRM assistant. Report to Sales Manager. Pipeline is new / quoted / won / lost on https://sable-floor.vercel.app \u2014 open it, do not rebuild it. Never invent prices.","x":90,"y":64},{"id":"research","slug":"sable-research","name":"Sable Research","cs":"RSH","layer":"worker","parent":"ceo","kind":"grok-bot","desk":"company","fn":"Company-level research. Not under Marketing or Sales desks.","open":"https://grok.com/","kw":["research","competitor","insight"],"done":"A sourced note with what is known vs missing. No invented prices.","job":"You are Sable Research. Company-level. Report to CEO SABLE, not Marketing or Sales desks. Research only. Never invent prices.","x":12,"y":86},{"id":"security","slug":"sable-security","name":"Sable Security","cs":"SEC","layer":"worker","parent":"ceo","kind":"grok-bot","desk":"company","fn":"Access, secrets, risk notes. Company-level.","open":"https://grok.com/","kw":["security","secret","access","risk"],"done":"Risks listed with owner and next control. No secrets stored in HQ.","job":"You are Sable Security. Company-level. Report to CEO SABLE. Flag access and secret risk. Do not ask for passwords. Never invent prices.","x":28,"y":86},{"id":"shoe","slug":"sable-shoe-machine","name":"Sable Shoe Machine","cs":"SHM","layer":"worker","parent":"ceo","kind":"grok-bot","desk":"company","fn":"Product and make notes for the shoe. Company-level.","open":"https://grok.com/","kw":["shoe","machine","product","leather","pair"],"done":"A product note that keeps the shoe as the hero. No invented prices.","job":"You are Sable Shoe Machine. Company-level. Report to CEO SABLE. The shoe is the hero. Leather shoes only. Never invent prices.","x":44,"y":86},{"id":"tester","slug":"sable-app-tester","name":"Sable app tester","cs":"QA","layer":"worker","parent":"ceo","kind":"grok-bot","desk":"company","fn":"Click paths, empty states, break notes on Sable apps.","open":"https://grok.com/","kw":["tester","qa","test","bug","app tester"],"done":"Pass/fail for the named flow, with one blocker if any.","job":"You are Sable app tester. Company-level. Report to CEO SABLE. Test the named Sable flow. Pass, fail, blocker. Do not redesign. Never invent prices.","x":60,"y":86},{"id":"prompt","slug":"prompt-bot","name":"Prompt bot","cs":"PRM","layer":"worker","parent":"ceo","kind":"grok-bot","desk":"channel","fn":"Prompts only. Not part of Floor ops.","open":"https://grok.com/","kw":["prompt","gpt-6","instructions"],"done":"A paste-ready prompt under 120 words with WHO, JOB, DONE WHEN.","job":"You are Prompt bot. Prompts only. Not Floor ops. Write a tight prompt for the named SABLE room. WHO + JOB + DONE WHEN. Never invent prices.","x":76,"y":86},{"id":"floor","slug":"sable-floor","name":"Sable Floor","cs":"FLR","layer":"worker","parent":"ceo","kind":"grok-bot","desk":"channel","fn":"Shared general knowledge. Max 6 hubs. Private 1:1s with Luan stay private.","open":"https://grok.com/","kw":["floor","hub","knowledge","general"],"done":"A Floor note that stays general. No private 1:1 content.","job":"You are Sable Floor. Shared general knowledge only. Max 6 hubs. Private 1:1s with Luan stay private. Not an execution desk. Never invent prices.","x":90,"y":86}]};
const R=C.rooms,D=C.docks,K='sable-hq-v1';
const P=[{id:'listed-price',label:'listedPrice faults',detail:'Listed price is wrong or missing on a live offer.',done:false,note:''},{id:'team-bank',label:'Team bank empty',detail:'Team payout account has no float.',done:false,note:''},{id:'delivery',label:'Delivery R150',detail:'Delivery is billed at R150. Confirm before quoting.',done:false,note:''}];
function load(){try{const p=JSON.parse(localStorage.getItem(K)||'{}');return{links:p.links||{},log:p.log||[],profit:P.map(r=>{const h=(p.profit||[]).find(x=>x.id===r.id);return h?{...r,done:!!h.done,note:h.note||''}:r}),pack:p.pack||null}}catch{return{links:{},log:[],profit:P,pack:null}}}
function save(s){localStorage.setItem(K,JSON.stringify(s))}
const S=load();
let selected=null,tab='terminal',hi=[],caption='',phase='idle',draft='',modal=null;
const room=id=>R.find(r=>r.id===id);
const bySlug=s=>R.find(r=>r.slug===s||r.id===s);
const reports=r=>r.id==='ceo'?'Luan':(room(r.parent)?.name||'CEO SABLE');
const openUrl=r=>(S.links[r.id]||r.open).trim();
function gpt6(r,job){return ['GPT-6 JOB · '+r.cs,'WHO: '+r.name,'REPORTS TO: '+reports(r),'KIND: '+(r.kind==='dock'?'live app — open the URL':'Grok bot chat'),'JOB: '+(job||r.job),'DONE WHEN: '+r.done,'','Paste into the target Grok bot (or Open bot). HQ does not run the agent.','Never invent prices. Escalate through CEO SABLE — do not skip to Luan unless Luan asks.'].join('\n')}
function packText(p,r){return ['SABLE MISSION PACK · FROM CEO SABLE (JARVIS)','WHO: '+p.who+' ['+r.cs+']','REPORTS TO: '+reports(r),'JOB: '+p.job,'DONE WHEN: '+p.doneCheck,'','1. Copy this pack.','2. Open the bot (or live app) for WHO.','3. Paste. HQ does not host the agent runtime.'].join('\n')}
function route(text){const lower=text.toLowerCase();let best=null,score=0;for(const r of R){if(r.id==='ceo')continue;let s=0;if(lower.includes(r.name.toLowerCase()))s+=4;for(const k of r.kw){if(k.length>2&&lower.includes(k))s+=k.includes(' ')?3:2}if(s>score){score=s;best=r}}if(best)return best;if(/\bsales|quote|deal|crm|chase\b/.test(lower))return room('sales');return room('marketing')}
function log(kind,roomId,body){S.log=[{id:Date.now()+Math.random(),kind,roomId,body},...S.log].slice(0,40);save(S);render()}
function copy(t,msg){navigator.clipboard.writeText(t).then(()=>toast(msg||'Copied'))}
function toast(m){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#141c22;border:1px solid #1c2a31;padding:10px 16px;border-radius:8px;z-index:50;font-size:14px';document.body.appendChild(el)}el.textContent=m;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',1800)}
function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.02;u.pitch=.92;speechSynthesis.speak(u)}
function assemble(text){const order=text.trim();if(!order)return;const who=route(order);S.pack={whoId:who.id,who:who.name,job:order,doneCheck:who.done};save(S);selected=who.id;tab='channel';hi=[who.id,who.parent].filter(Boolean);caption='Pack ready for '+who.name+'. Copy it, then open the bot.';phase='speaking';log('pack',who.id,'JARVIS assembled '+who.name+': '+order);speak(caption);setTimeout(()=>{hi=[];phase='idle';render()},8000);render()}
const path=()=>location.pathname;
function esc(s){return String(s).replace(/&/g,'&'+'amp;').replace(/</g,'&'+'lt;').replace(/>/g,'&'+'gt;').replace(/"/g,'&'+'quot;').replace(/'/g,'&#39;')}
function render(){const p=path();if(p.startsWith('/protocol'))return renderProtocol();if(p.startsWith('/station/'))return renderStation(decodeURIComponent(p.split('/')[2]||''));const sel=room(selected);document.getElementById('app').innerHTML=`<header class="bar"><a class="brand" href="/">SABLE</a><span class="sub">HQ · CEO command</span>${D.map(d=>`<a class="dock" href="${esc(d.url)}" target="_blank" rel="noreferrer">${esc(d.label)}</a>`).join('')}<span class="sub" style="margin-left:auto" id="clock"></span><button class="icon" data-m="profit" title="Profit">P</button><button class="icon" data-m="api" title="Optional Grok API">K</button><button class="icon" data-m="links" title="Deep links">L</button></header><div class="body"><section class="panel term">${termHTML()}</section><div class="tabs"><button data-tab="terminal" class="${tab==='terminal'?'on':''}">Terminal</button><button data-tab="comms" class="${tab==='comms'?'on':''}">Comms</button><button data-tab="channel" class="${tab==='channel'?'on':''}">Channel</button></div><div class="cols">${networkHTML()}${coreHTML()}${sel?channelHTML(sel):commsHTML()}</div><div class="mob">${tab==='comms'?commsHTML():tab==='channel'&&sel?channelHTML(sel):coreHTML()}</div></div><div class="cmd"><div class="chips"><button class="chip" data-chip="Sable Social: five Reel hooks, shoe is the hero">Sable Social: five Reel hooks</button><button class="chip" data-chip="Sales Chase: next action on quoted deals">Sales Chase: next action</button><button class="chip" data-chip="Marketing CEO: 17:15 rollup pack">Marketing CEO rollup</button></div><form class="panel form" id="cmd"><button type="button" id="mic" class="icon" style="border:0;color:var(--ac)">●</button><input id="draft" placeholder="Who + one job — JARVIS builds a pack. Then Open bot." value="${esc(draft)}"/><button class="btn" type="submit">↑</button></form></div>${modalHTML()}`;tick();bind()}
function termHTML(){const edges=R.filter(r=>r.parent).map(r=>({from:r.parent,to:r.id}));const pos=id=>R.find(r=>r.id===id);const paths=edges.map(e=>{const a=pos(e.from),b=pos(e.to);if(!a||!b)return '';const active=hi.includes(e.from)||hi.includes(e.to);const mid=(a.y+b.y)/2;const d=`M ${a.x} ${a.y} C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${b.y}`;return `<path d="${d}" fill="none" stroke="#7ecad8" stroke-width="${active?0.55:0.28}" opacity="${active?0.9:0.28}" vector-effect="non-scaling-stroke"/>`+(active?`<circle r="0.9" fill="#7ecad8"><animateMotion dur="2.4s" repeatCount="indefinite" path="${d}"/></circle>`:'')}).join('');const nodes=R.map(r=>{const cls=['node',r.layer==='ceo'?'ceo':'',selected===r.id?'sel':'',hi.includes(r.id)?'hot':''].filter(Boolean).join(' ');const label=r.layer==='ceo'?'JARVIS':r.name.replace(/^Sable /,'');return `<button class="${cls}" data-sel="${r.id}" style="left:${r.x}%;top:${r.y}%"><span class="dot">${esc(r.cs.slice(0,3))}</span><span class="nl">${esc(label)}</span></button>`}).join('');return `<div class="h" style="position:absolute;top:12px;left:16px;z-index:4">NETWORK</div><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${paths}</svg>${nodes}`}
function networkHTML(){const ceo=R.find(r=>r.layer==='ceo');const dirs=R.filter(r=>r.parent===ceo.id&&r.layer==='director');const company=R.filter(r=>r.desk==='company');const channels=R.filter(r=>r.desk==='channel');const row=(r,d)=>`<button class="row ${selected===r.id?'sel':''}" data-sel="${r.id}" style="padding-left:${8+d*14}px"><span style="width:6px;height:6px;border-radius:99px;background:${r.kind==='dock'?'var(--ok)':'var(--ac)'};margin-top:8px;flex-shrink:0"></span><span style="min-width:0"><b>${esc(r.name)}</b> <span class="sub">${esc(r.cs)}</span><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(S.pack&&S.pack.whoId===r.id?S.pack.job:r.fn)}</div></span></button>`;return `<section class="panel"><div class="scroll"><div style="display:flex;justify-content:space-between;align-items:center;padding:0 8px 8px"><p class="h">NETWORK</p><a class="sub" href="/protocol" style="text-decoration:none">Protocol</a></div>${row(ceo,0)}${dirs.map(dir=>row(dir,1)+R.filter(u=>u.parent===dir.id).map(u=>row(u,2)).join('')).join('')}<p class="sub" style="padding:8px">Company</p>${company.map(r=>row(r,1)).join('')}<p class="sub" style="padding:8px">Channels</p>${channels.map(r=>row(r,1)).join('')}</div></section>`}
function coreHTML(){return `<section class="panel"><div class="core"><button class="ring" id="hold" aria-label="Talk to JARVIS"><div class="eq">${[0,1,2,3,4,5,6,7].map(i=>`<i style="height:${12+i*3}px;animation-delay:${i*70}ms"></i>`).join('')}</div></button><div class="lab">${phase==='listening'?'Listening':phase==='speaking'?'JARVIS':'HOLD TO SPEAK'}</div><div class="cap">${esc(caption||'Talk to JARVIS. He will assemble the Grok bots.')}</div></div></section>`}
function commsHTML(){const items=S.log.length?S.log.map(x=>`<article style="padding:8px"><div class="sub" style="color:${x.kind==='pack'?'var(--ac)':x.kind==='open'?'var(--ok)':'var(--su)'}">${x.kind.toUpperCase()} · ${esc((room(x.roomId)||{}).cs||'HQ')}</div><p style="margin:4px 0 0">${esc(x.body)}</p></article>`).join(''):`<p class="muted">Operator actions only. Copy a job or open a bot and it logs here. HQ does not stream agent sitreps.</p>`;return `<section class="panel"><div class="scroll"><p class="h">COMMS</p>${items}</div></section>`}
function channelHTML(r){const assigned=S.pack&&S.pack.whoId===r.id?S.pack:null;const url=openUrl(r);return `<section class="panel"><div class="scroll"><p class="h">CHANNEL · ${esc(r.cs)}</p><h2 style="margin:4px 0">${esc(r.name)}</h2><p class="muted">${esc(reports(r))} · ${r.kind==='dock'?'live app':'Grok bot'}</p><p class="muted">${esc(r.fn)}</p>${assigned?`<pre class="pre">${esc(packText(assigned,r))}</pre>`:`<p class="muted">No live agent in this page. Open the bot, paste a GPT-6 job. HQ only navigates and copies packs.</p>`}<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><button class="btn" data-open="${r.id}">${r.kind==='dock'?'Open live app':'Open bot'}</button><button class="btn g" data-job="${r.id}">Copy GPT-6 job</button><button class="btn g" data-pack="${r.id}">Copy mission pack</button><a class="btn g" href="/station/${r.slug}" style="text-decoration:none;display:inline-flex;align-items:center">Station</a></div><p class="sub" style="margin-top:16px">Open target: ${esc(url)}</p></div></section>`}
function modalHTML(){if(!modal)return '';if(modal==='api')return `<div class="modal"><div class="panel sheet"><p class="h wn">OPTIONAL · SEPARATE</p><h2>Grok API</h2><p class="muted">This panel is not the command system. Open bot, Copy GPT-6 job, and JARVIS mission packs work without a key.</p><p class="muted" style="margin-top:12px">Not connected. Set GROK_API_KEY later if you want model calls from HQ. Until then this stays inert — no fake sitreps, no agent streams.</p><button class="btn g" data-m="">Close</button></div></div>`;if(modal==='profit')return `<div class="modal"><div class="panel sheet"><p class="h">Profit</p><h2>Checklist</h2><p class="muted">Local only. Tick what is actually true. Do not invent prices.</p>${S.profit.map(i=>`<label style="display:block;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:10px 0"><input type="checkbox" data-profit="${i.id}" ${i.done?'checked':''}/> <b>${esc(i.label)}</b><div class="muted">${esc(i.detail)}</div><input style="width:100%;margin-top:6px;height:36px;background:var(--el);border:1px solid var(--bd);border-radius:8px;padding:0 8px" data-note="${i.id}" value="${esc(i.note)}" placeholder="Note (optional)"/></label>`).join('')}<button class="btn g" data-m="">Close</button></div></div>`;if(modal==='links')return `<div class="modal"><div class="panel sheet"><p class="h">Deep links</p><h2>Open-bot targets</h2><p class="muted">Paste each Grok bot share URL. Defaults open grok.com. CRM stays on the live Floor app.</p>${R.map(r=>`<label style="display:block;margin:10px 0"><span class="sub">${esc(r.cs)} ${esc(r.name)}</span><input style="width:100%;height:40px;background:var(--el);border:1px solid var(--bd);border-radius:8px;padding:0 8px;font-family:IBM Plex Mono,monospace;font-size:12px" data-link="${r.id}" value="${esc(openUrl(r))}"/></label>`).join('')}<button class="btn g" data-m="">Close</button></div></div>`;return ''}
function renderProtocol(){const lines=['SABLE HQ PROTOCOL','Sable.co — leather shoes. Brand-first. The shoe is the hero.','North star: more leads + paying customers. Owner: Luan Lensley.','CHAIN: Luan → CEO SABLE (JARVIS) → Marketing CEO or Sales Manager (peers).','Escalate through CEO SABLE. Do not skip to Luan unless Luan asks.','Cadence: desks ~17:00, CEO rollup ~17:15, Luan brief 17:30.','','ROOMS',...R.map(r=>'- '+r.name+' ['+r.cs+'] → '+reports(r)+' — '+r.fn)].join('\n');document.getElementById('app').innerHTML=`<main style="max-width:720px;margin:0 auto;padding:24px"><p class="h" style="color:var(--ac)">For Grok bots</p><h1>SABLE protocol</h1><p class="muted">Paste this into a Grok bot, or copy a GPT-6 job per room. HQ does not run the agents.</p><pre class="panel pre" style="max-height:none;padding:16px">${esc(lines)}</pre><div style="display:flex;gap:8px;margin:12px 0"><button class="btn" id="cp">Copy protocol</button><a class="btn g" href="/" style="text-decoration:none;display:inline-flex;align-items:center">Command deck</a></div><h3 class="h">Copy GPT-6 job</h3>${R.map(r=>`<button class="row" data-copyjob="${r.id}" style="border:1px solid var(--bd);margin:6px 0"><span>${esc(r.name)}</span><span class="sub">copy</span></button>`).join('')}</main>`;document.getElementById('cp').onclick=()=>copy(lines,'Protocol copied');document.querySelectorAll('[data-copyjob]').forEach(b=>b.onclick=()=>copy(gpt6(room(b.dataset.copyjob)),b.dataset.copyjob+' job copied'))}
function renderStation(slug){const r=bySlug(slug);if(!r){document.getElementById('app').innerHTML='<main style="padding:40px"><h1>Station not found</h1><a href="/">Return to HQ</a></main>';return}const packet=['SABLE STATION · '+r.name,'CALLSIGN: '+r.cs,'REPORTS TO: '+reports(r),'KIND: '+(r.kind==='dock'?'live app':'Grok bot'),'OPEN: '+r.open,'',r.fn,'',gpt6(r)].join('\n');document.getElementById('app').innerHTML=`<main style="max-width:720px;margin:0 auto;padding:24px"><p class="h" style="color:var(--ac)">SABLE station</p><h1>${esc(r.name)}</h1><p class="muted">${esc(r.cs)} · reports to ${esc(reports(r))}</p><pre class="panel pre" style="max-height:none;padding:16px">${esc(packet)}</pre><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><button class="btn" data-open="${r.id}">${r.kind==='dock'?'Open live app':'Open bot'}</button><button class="btn g" data-job="${r.id}">Copy GPT-6 job</button><a class="btn g" href="/" style="text-decoration:none;display:inline-flex;align-items:center">Command deck</a></div></main>`;bind()}
function tick(){const el=document.getElementById('clock');if(!el)return;el.textContent=new Date().toLocaleTimeString('en-ZA',{hour12:false,timeZone:'Africa/Johannesburg'})}
function bind(){document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{selected=b.dataset.sel;tab='channel';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modal=b.dataset.m||null;render()});document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{draft=b.dataset.chip;render();document.getElementById('draft')&&document.getElementById('draft').focus()});document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{const r=room(b.dataset.job);copy(gpt6(r,S.pack&&S.pack.whoId===r.id?S.pack.job:null),'GPT-6 job copied');log('copy',r.id,'Copied GPT-6 job for '+r.name)});document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{const r=room(b.dataset.pack);if(S.pack&&S.pack.whoId===r.id){copy(packText(S.pack,r),'Mission pack copied');log('copy',r.id,'Copied mission pack for '+r.name)}else copy(gpt6(r),'GPT-6 job copied')});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const r=room(b.dataset.open);window.open(openUrl(r),'_blank','noopener');log('open',r.id,'Opened '+r.name)});document.querySelectorAll('[data-profit]').forEach(b=>b.onchange=()=>{const i=S.profit.find(x=>x.id===b.dataset.profit);i.done=b.checked;save(S)});document.querySelectorAll('[data-note]').forEach(b=>b.oninput=()=>{const i=S.profit.find(x=>x.id===b.dataset.note);i.note=b.value;save(S)});document.querySelectorAll('[data-link]').forEach(b=>b.oninput=()=>{S.links[b.dataset.link]=b.value;save(S)});const form=document.getElementById('cmd');if(form)form.onsubmit=e=>{e.preventDefault();assemble(document.getElementById('draft').value);draft=''};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const listen=()=>{if(!SR){toast('Voice is not available here — type the order instead');return}const rec=new SR();rec.lang='en-ZA';rec.onresult=ev=>{assemble(ev.results[0][0].transcript)};rec.start();phase='listening';caption='Listening…';render()};const mic=document.getElementById('mic');const hold=document.getElementById('hold');if(mic)mic.onpointerdown=listen;if(hold)hold.onpointerdown=listen}
setInterval(tick,1000);
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='Escape'){selected=null;modal=null;render()}});
render();

</script>
</body>
</html>
